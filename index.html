<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>LED 滚动字幕 · 测试版</title>
<style>
  :root{--accent:#ff3b3b;--panel:rgba(18,18,20,.93);--line:rgba(255,255,255,.12);--txt:#f2f2f5;--dim:#9a9aa5;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#000;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    overscroll-behavior:none;}

  /* ---------- 舞台与旋转容器 ---------- */
  #stage{position:fixed;inset:0;overflow:hidden;background:#000;touch-action:none}
  #rotor{position:absolute;left:50%;top:50%;transform-origin:center center;overflow:hidden}
  #track{position:absolute;white-space:nowrap;will-change:transform}
  #text{
    display:inline-block;white-space:nowrap;line-height:1;
    font-weight:700;letter-spacing:.03em;
    font-family:"PingFang SC","Microsoft YaHei UI","Microsoft YaHei",system-ui,"Segoe UI",sans-serif;
    transform-origin:center center;
  }
  #text.vertical{writing-mode:vertical-rl;text-orientation:upright;letter-spacing:.06em}
  #text.glow{text-shadow:0 0 .03em currentColor,0 0 .09em currentColor}
  #text.stroke{-webkit-text-stroke:.035em #000}
  #text.dots{
    -webkit-mask-image:radial-gradient(circle,#000 42%,rgba(0,0,0,0) 48%);
    -webkit-mask-size:.055em .055em;-webkit-mask-repeat:repeat;
    mask-image:radial-gradient(circle,#000 42%,rgba(0,0,0,0) 48%);
    mask-size:.055em .055em;mask-repeat:repeat;
  }
  #text.mirror{transform:scaleX(-1)}

  /* ---------- 顶栏 ---------- */
  #hud{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;
    align-items:center;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
    background:linear-gradient(#000 10%,transparent);opacity:0;transition:opacity .25s;pointer-events:none;}
  body.ui #hud{opacity:1;pointer-events:auto}
  #hud .hint{font-size:12px;color:var(--dim);letter-spacing:.04em}
  .iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);
    background:rgba(255,255,255,.06);color:var(--txt);font-size:17px;display:grid;place-items:center;cursor:pointer;}
  .iconbtn:active{transform:scale(.95)}

  /* ---------- 控制面板 ---------- */
  #panel{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);
    backdrop-filter:blur(14px);border-top:1px solid var(--line);border-radius:18px 18px 0 0;
    padding:14px 16px calc(env(safe-area-inset-bottom) + 16px);
    transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
    max-height:80vh;overflow-y:auto;touch-action:pan-y;}
  body.ui #panel{transform:translateY(0)}
  .row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .row label{font-size:12px;color:var(--dim);min-width:52px}
  #input{flex:1;min-width:0;background:#0b0b0d;border:1px solid var(--line);border-radius:10px;
    color:var(--txt);font-size:16px;padding:10px 12px;font-family:inherit;outline:none;}
  #input:focus{border-color:var(--accent)}
  input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:26px;background:transparent}
  input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:#33333a}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;
    background:#fff;margin-top:-8px;box-shadow:0 1px 4px rgba(0,0,0,.6)}
  .val{font-size:12px;color:var(--dim);min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
  .swatches{display:flex;gap:8px;flex-wrap:wrap}
  .sw{width:28px;height:28px;border-radius:9px;border:2px solid transparent;cursor:pointer}
  .sw.on{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{font-size:12px;color:var(--txt);background:rgba(255,255,255,.07);border:1px solid var(--line);
    border-radius:999px;padding:7px 12px;cursor:pointer;}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#111;font-weight:700}
  .preset{font-size:13px;color:var(--txt);background:rgba(255,255,255,.05);border:1px solid var(--line);
    border-radius:10px;padding:8px 12px;cursor:pointer;}
  .divider{height:1px;background:var(--line);margin:14px 0}
  .note{font-size:11px;color:#6f6f7a;line-height:1.6;margin-top:10px}
  #toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.82);
    border:1px solid var(--line);color:#fff;font-size:13px;padding:10px 16px;border-radius:10px;
    z-index:50;opacity:0;pointer-events:none;transition:opacity .3s;}
  #toast.show{opacity:1}
  .now{font-size:11px;color:var(--dim);margin-left:auto}
</style>
  <!-- PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LED字幕">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
</head>
<body>

<div id="stage">
  <div id="rotor">
    <div id="track"><span id="text">加油！</span></div>
  </div>
</div>

<div id="hud">
  <div class="hint">点击画面呼出设置</div>
  <div style="display:flex;gap:8px">
    <button class="iconbtn" id="btnFull" title="全屏">⛶</button>
    <button class="iconbtn" id="btnPanel" title="设置">⚙</button>
  </div>
</div>

<div id="panel">
  <div class="row">
    <label>文字</label>
    <input id="input" type="text" value="加油！" maxlength="120" enterkeyhint="done">
  </div>

  <div class="row">
    <label>方向</label>
    <div class="chips" id="orientChips">
      <div class="chip" data-orient="auto">跟随手机</div>
      <div class="chip" data-orient="landscape">强制横屏</div>
      <div class="chip" data-orient="portrait">强制竖屏</div>
    </div>
    <span class="now" id="nowDir"></span>
  </div>

  <div class="row">
    <label>排版</label>
    <div class="chips" id="layoutChips">
      <div class="chip" data-layout="h">横排</div>
      <div class="chip" data-layout="v">竖排</div>
    </div>
  </div>

  <div class="row">
    <label>速度</label>
    <input id="speed" type="range" min="40" max="900" step="10" value="220">
    <span class="val" id="speedVal">220</span>
  </div>

  <div class="row">
    <label>字号</label>
    <input id="size" type="range" min="8" max="80" step="1" value="30">
    <span class="val" id="sizeVal">30</span>
  </div>

  <div class="row">
    <label>颜色</label>
    <div class="swatches" id="colors"></div>
  </div>

  <div class="row">
    <label>背景</label>
    <div class="swatches" id="bgs"></div>
  </div>

  <div class="row">
    <label>效果</label>
    <div class="chips">
      <div class="chip" data-flag="glow">发光</div>
      <div class="chip" data-flag="dots">点阵</div>
      <div class="chip" data-flag="stroke">描边</div>
      <div class="chip" data-flag="mirror">镜像</div>
      <div class="chip" data-flag="flip">翻转 180°</div>
      <div class="chip" data-flag="blink">闪烁</div>
      <div class="chip" data-flag="awake">防息屏</div>
    </div>
  </div>

  <div class="divider"></div>
  <div class="chips" id="presets" style="margin-bottom:12px"></div>

  <div class="note">
    手机横过来举牌时，选「强制横屏」可以让画面始终按横版排版，即使手机临时转回竖屏也不跳变。<br>
    字号按「垂直于滚动方向的那条边」计算，所以横排/竖排切换时大小基准一致。
  </div>
</div>

<div id="toast"></div>

<script>
(function(){
  'use strict';
  var $ = function(s){ return document.querySelector(s); };

  var stage = $('#stage'), rotor = $('#rotor'), track = $('#track'), textEl = $('#text');
  var input = $('#input'), speed = $('#speed'), size = $('#size');

  var COLORS = ['#ff3b3b','#ff8a00','#ffe600','#29ff6a','#00e5ff','#4d7cff','#b45cff','#ff4db8','#ffffff'];
  var BGS    = ['#000000','#0d0d10','#001030','#1a0010','#001a10','#ffffff'];
  var PRESETS = ['加油！','欢迎回家','接机 · 张先生','生日快乐 🎂','PLEASE MARRY ME','SALE 50% OFF'];

  var state = {
    text:'加油！', speed:220, size:30, color:'#ff3b3b', bg:'#000000',
    orient:'auto',      // auto | landscape | portrait
    layout:'h',         // h | v
    glow:false, dots:false, stroke:false, mirror:false, flip:false, blink:false, awake:true
  };

  /* ---------------- 持久化 ---------------- */
  function load(){
    try{ var raw = localStorage.getItem('led-banner-v2'); if(raw) Object.assign(state, JSON.parse(raw)); }catch(e){}
  }
  function save(){
    try{ localStorage.setItem('led-banner-v2', JSON.stringify(state)); }catch(e){}
  }
  // 输入时每个字符都写 localStorage 会卡，攒 250ms 再落盘
  var saveT = null;
  function scheduleSave(){ clearTimeout(saveT); saveT = setTimeout(function(){ saveT = null; save(); }, 250); }
  function flushSave(){ if(saveT !== null){ clearTimeout(saveT); saveT = null; save(); } }

  /* ---------------- 布局：旋转 + 字号 ---------------- */
  var dims = { w:0, h:0 };
  var layoutSig = '';

  function computeRotation(){
    var portraitNow = window.innerHeight > window.innerWidth;
    if(state.orient === 'landscape' && portraitNow) return 90;
    if(state.orient === 'portrait' && !portraitNow) return -90;
    return 0;
  }

  function layout(){
    var rot = computeRotation();
    // 旋转时交换宽高，让内容在屏幕上始终占满
    var w = rot ? window.innerHeight : window.innerWidth;
    var h = rot ? window.innerWidth  : window.innerHeight;
    dims.w = w; dims.h = h;

    rotor.style.width  = w + 'px';
    rotor.style.height = h + 'px';
    rotor.style.marginLeft = (-w / 2) + 'px';
    rotor.style.marginTop  = (-h / 2) + 'px';
    rotor.style.transform = 'rotate(' + (rot + (state.flip ? 180 : 0)) + 'deg)';
    rotor.style.background = state.bg;

    // 字号基准：垂直于滚动方向的那条边
    var base = state.layout === 'v' ? w : h;
    textEl.style.fontSize = (base * state.size / 100) + 'px';

    track.style.left = state.layout === 'v' ? '50%' : '0';
    track.style.top  = state.layout === 'v' ? '0'   : '50%';

    var lb = $('#nowDir');
    if(lb){
      lb.textContent = (window.innerHeight > window.innerWidth ? '当前竖屏' : '当前横屏') + (rot ? ' · 已旋转' : '');
    }
    // 只有几何真的变了才重置滚动；改文字时不该把字幕打回起点
    var sig = [rot, w, h, state.layout, textEl.style.fontSize].join('|');
    if(sig !== layoutSig){ layoutSig = sig; resetScroll(); }
  }

  /* ---------------- 滚动 ---------------- */
  var pos = { x:0, y:0 }, last = 0, paused = false, blinkOn = true, blinkT = 0;

  function trackLen(){
    return state.layout === 'v' ? textEl.offsetHeight : textEl.offsetWidth;
  }

  function resetScroll(){
    if(state.layout === 'v'){
      pos.y = dims.h;
      track.style.transform = 'translate3d(-50%,' + Math.round(pos.y) + 'px,0)';
    }else{
      pos.x = dims.w;
      track.style.transform = 'translate3d(' + Math.round(pos.x) + 'px,-50%,0)';
    }
  }

  function tick(now){
    if(!last) last = now;
    var dt = Math.min((now - last) / 1000, .05);
    last = now;

    if(!paused){
      var len = trackLen();
      if(state.layout === 'v'){
        pos.y -= state.speed * dt;
        if(pos.y < -len - 20) pos.y = dims.h;
        track.style.transform = 'translate3d(-50%,' + Math.round(pos.y) + 'px,0)';
      }else{
        pos.x -= state.speed * dt;
        if(pos.x < -len - 20) pos.x = dims.w;
        track.style.transform = 'translate3d(' + Math.round(pos.x) + 'px,-50%,0)';
      }
    }

    if(state.blink){
      blinkT += dt;
      if(blinkT > .45){ blinkT = 0; blinkOn = !blinkOn; textEl.style.opacity = blinkOn ? 1 : 0; }
    }else{
      textEl.style.opacity = 1;
    }
    requestAnimationFrame(tick);
  }

  /* ---------------- 样式应用 ---------------- */
  function applyStyle(){
    textEl.textContent = state.text || ' ';
    textEl.style.color = state.color;
    textEl.classList.toggle('vertical', state.layout === 'v');
    textEl.classList.toggle('glow', state.glow);
    textEl.classList.toggle('dots', state.dots);
    textEl.classList.toggle('stroke', state.stroke);
    textEl.classList.toggle('mirror', state.mirror);
    stage.style.background = state.bg;
    document.body.style.background = state.bg;
    layout();
    scheduleSave();
  }

  /* ---------------- 控件 ---------------- */
  function toast(msg){
    var t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove('show'); }, 1300);
  }

  function buildSwatches(){
    COLORS.forEach(function(c){
      var d = document.createElement('div');
      d.className='sw'; d.style.background=c; d.dataset.color=c;
      d.onclick=function(){ state.color=c; markSwatches(); applyStyle(); };
      $('#colors').appendChild(d);
    });
    BGS.forEach(function(c){
      var d = document.createElement('div');
      d.className='sw'; d.style.background=c; d.style.border='1px solid #333'; d.dataset.bg=c;
      d.onclick=function(){ state.bg=c; markSwatches(); applyStyle(); };
      $('#bgs').appendChild(d);
    });
  }
  function markSwatches(){
    document.querySelectorAll('#colors .sw').forEach(function(el){ el.classList.toggle('on', el.dataset.color===state.color); });
    document.querySelectorAll('#bgs .sw').forEach(function(el){ el.classList.toggle('on', el.dataset.bg===state.bg); });
  }
  function buildPresets(){
    PRESETS.forEach(function(p){
      var b=document.createElement('div'); b.className='preset'; b.textContent=p;
      b.onclick=function(){ state.text=p; input.value=p; applyStyle(); toast('已切换：'+p); };
      $('#presets').appendChild(b);
    });
  }
  function syncChips(){
    document.querySelectorAll('.chip[data-flag]').forEach(function(el){ el.classList.toggle('on', !!state[el.dataset.flag]); });
    document.querySelectorAll('.chip[data-orient]').forEach(function(el){ el.classList.toggle('on', el.dataset.orient===state.orient); });
    document.querySelectorAll('.chip[data-layout]').forEach(function(el){ el.classList.toggle('on', el.dataset.layout===state.layout); });
  }

  document.querySelectorAll('.chip[data-flag]').forEach(function(el){
    el.onclick=function(){
      var k=el.dataset.flag; state[k]=!state[k];
      if(k==='awake'){ state.awake ? requestWake() : releaseWake(); }
      syncChips(); applyStyle();
    };
  });
  document.querySelectorAll('.chip[data-orient]').forEach(function(el){
    el.onclick=function(){
      state.orient=el.dataset.orient; syncChips(); applyStyle();
      toast(state.orient==='auto' ? '方向：跟随手机' : (state.orient==='landscape' ? '方向：强制横屏' : '方向：强制竖屏'));
    };
  });
  document.querySelectorAll('.chip[data-layout]').forEach(function(el){
    el.onclick=function(){
      state.layout=el.dataset.layout; syncChips(); applyStyle();
      toast(state.layout==='v' ? '排版：竖排' : '排版：横排');
    };
  });

  var hideTimer;
  function showUI(){ document.body.classList.add('ui'); clearTimeout(hideTimer); hideTimer=setTimeout(hideUI,5000); }
  function hideUI(){ document.body.classList.remove('ui'); }
  // 面板里任何操作都续期，避免打字打到一半面板自己收起
  function bumpUI(){ if(document.body.classList.contains('ui')) showUI(); }
  $('#panel').addEventListener('input', bumpUI);
  $('#panel').addEventListener('click', bumpUI);

  stage.addEventListener('click', function(){ document.body.classList.contains('ui') ? hideUI() : showUI(); });
  $('#btnPanel').onclick=function(e){ e.stopPropagation(); showUI(); };
  $('#btnFull').onclick=function(e){ e.stopPropagation(); toggleFull(); };

  function toggleFull(){
    var d=document.documentElement;
    if(!document.fullscreenElement && !document.webkitFullscreenElement){
      (d.requestFullscreen||d.webkitRequestFullscreen||function(){}).call(d);
    }else{
      (document.exitFullscreen||document.webkitExitFullscreen||function(){}).call(document);
    }
  }

  input.addEventListener('input', function(){ state.text=input.value; applyStyle(); });
  speed.addEventListener('input', function(){ state.speed=+speed.value; $('#speedVal').textContent=state.speed; scheduleSave(); });
  size.addEventListener('input', function(){ state.size=+size.value; $('#sizeVal').textContent=state.size; applyStyle(); });

  /* ---------------- 防息屏 ---------------- */
  var wakeLock=null;
  async function requestWake(){
    try{
      if('wakeLock' in navigator){
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', function(){ wakeLock=null; });
        toast('已开启防息屏');
      }else{ toast('此浏览器不支持防息屏'); }
    }catch(err){ toast('防息屏开启失败：'+err.message); }
  }
  function releaseWake(){
    try{ if(wakeLock){ var w=wakeLock; wakeLock=null; w.release(); } }catch(e){}
  }
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState==='visible'){
      if(state.awake && !wakeLock) requestWake();
    }else{
      flushSave();   // 切走前把攒着的设置落盘
    }
  });

  /* ---------------- 键盘 ---------------- */
  document.addEventListener('keydown', function(e){
    if(e.target.tagName==='INPUT') return;
    if(e.code==='Space'){ e.preventDefault(); paused=!paused; toast(paused?'暂停':'继续'); }
    if(e.key==='f'||e.key==='F'){ toggleFull(); }
    if(e.key==='Escape'){ hideUI(); }
  });

  /* ---------------- 启动 ---------------- */
  load();

  // 便于截图/分享的参数：?text=..&size=..&color=%23ff0&layout=v&orient=landscape&preview=1
  var q = new URLSearchParams(location.search);
  ['text'].forEach(function(k){ if(q.has(k)) state[k]=q.get(k); });
  ['speed','size'].forEach(function(k){ if(q.has(k)) state[k]=+q.get(k); });
  if(q.has('color')) state.color = q.get('color').replace(/^#?/, '#');
  if(q.has('bg'))    state.bg    = q.get('bg').replace(/^#?/, '#');
  if(q.has('layout')) state.layout = q.get('layout') === 'v' ? 'v' : 'h';
  if(q.has('orient')) state.orient = ['auto','landscape','portrait'].indexOf(q.get('orient'))>=0 ? q.get('orient') : 'auto';
  ['flip','glow','dots','stroke','mirror','blink'].forEach(function(k){ if(q.has(k)) state[k] = q.get(k)==='1'; });

  buildSwatches(); buildPresets();
  input.value = state.text;
  speed.value = state.speed; size.value = state.size;
  $('#speedVal').textContent = state.speed;
  $('#sizeVal').textContent = state.size;
  markSwatches(); syncChips(); applyStyle();
  requestAnimationFrame(tick);

  var isPreview = q.has('preview');
  if(isPreview){
    setTimeout(function(){
      paused = true;
      if(state.layout==='v'){ pos.y = (dims.h - textEl.offsetHeight)/2; track.style.transform='translate3d(-50%,'+Math.round(pos.y)+'px,0)'; }
      else { pos.x = (dims.w - textEl.offsetWidth)/2; track.style.transform='translate3d('+Math.round(pos.x)+'px,-50%,0)'; }
      document.body.classList.remove('ui'); clearTimeout(hideTimer);
    }, 80);
  }else{
    setTimeout(function(){ showUI(); }, 300);
  }

  if(state.awake){
    stage.addEventListener('click', function once(){ requestWake(); stage.removeEventListener('click', once); }, {once:true});
  }

  // 方向/尺寸变化时重排
  var rt;
  function onResize(){ clearTimeout(rt); rt = setTimeout(function(){ applyStyle(); }, 120); }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', onResize);
})();
</script>
<script src="./install.js" defer></script>
</body>
</html>
